<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign-in Safety Check</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 12px; color: #1b1b1b; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .status { font-weight: 600; margin-bottom: 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-left: 4px solid; padding: 4px 8px; margin: 6px 0; background: #f6f6f6; }
    li.high { border-color: #c62828; } li.warn { border-color: #d4a017; } li.info { border-color: #607d8b; }
    li b { text-transform: uppercase; font-size: 11px; display: block; }
    label { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .note { color: #555; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Sign-in Safety Check</h1>
  <div class="status" id="status">Checking...</div>
  <ul id="list"></ul>
  <label><input type="checkbox" id="toggle" /> Outline flagged fields on the page</label>
  <div class="note">Checks page structure only. It never reads what you type and sends nothing anywhere.</div>
  <script src="popup.js"></script>
</body>
</html>
