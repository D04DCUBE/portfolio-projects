<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Safe sign-in (test)</title></head>
<body style="font-family:system-ui;max-width:420px;margin:40px auto">
  <h1>Sign in (well built)</h1>
  <form method="post" action="">
