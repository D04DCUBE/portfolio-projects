<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Risky sign-in (test)</title></head>
<body style="font-family:system-ui;max-width:420px;margin:40px auto">
  <h1>Sign in (badly built)</h1>
  <form method="get" action="https://example.org/login">
    <p><input type="email" placeholder="Email" /></p>
    <p><input type="password" placeholder="Password" autocomplete="off" /></p>
    <button type="submit" onclick="return false">Sign in</button>
  </form>
  <p>Expected: red badge, with 4 findings: GET method, other-site target, autocomplete off, no label.</p>
  <button id="add">Add a second login form after load</button>
  <script>
    document.getElementById("add").onclick = () => {
      const f = document.createElement("form");
      f.innerHTML = '<p><input type="password" placeholder="Added later" /></p>';
      document.body.append(f);
    };
  </script>
</body>
</html>
