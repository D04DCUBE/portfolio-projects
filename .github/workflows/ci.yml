name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    name: ${{ matrix.project }} · unit + Playwright
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [agent-eval-lab, ai-chat, kanban-app, notes-app, realtime-chat, training-dashboard, design-system, browser-extension]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test --if-present
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright API + UI tests
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: ${{ matrix.project }}/playwright-report
          retention-days: 14

  operator-screen:
    name: operator-screen · checks, unit + Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator-screen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Contract is in sync
        run: npm run contract:check
      - name: Design-token lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright API tests
        run: npx playwright test --project=api
      - name: Playwright UI tests
        run: npx playwright test --project=ui
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-operator-screen
          path: operator-screen/playwright-report
          retention-days: 14
